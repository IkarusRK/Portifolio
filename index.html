<!doctype html>
<html lang="pt-BR" data-theme="purple" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/patinha.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ikarus Sylver • Full Stack, FiveM & 3D Portfolio</title>
    <meta name="description" content="Portfólio de Ikarus Sylver: Desenvolvedor Full Stack, FiveM/GTA RP e Worldbuilding 3D. Criador de Eclipsário 3D, sistemas de alta performance e experiências interativas." />
    <script>
      try {
        var t = localStorage.getItem('portfolio-theme') || 'purple';
        var m = localStorage.getItem('portfolio-mode') || 'dark';
        var l = localStorage.getItem('portfolio-lang') || 'pt';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('data-mode', m);
        document.documentElement.setAttribute('lang', l);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
